interface=wlxac15a2e2f47e
bind-interfaces
no-daemon

# DHCP: assign IPs to clients
dhcp-range=192.168.60.10,192.168.60.100,12h

# Push gateway and DNS to clients
dhcp-option=3,192.168.60.1
dhcp-option=6,103.86.96.100,103.86.99.100

# DNS upstream (clients resolve through VPN)
no-resolv
server=103.86.96.100
server=103.86.99.100

dhcp-leasefile=/tmp/dnsmasq-ap.leases

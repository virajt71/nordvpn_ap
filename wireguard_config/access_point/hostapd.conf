# WiFi Access Point Configuration
# Interface: wlxac15a2e2f47e (USB WiFi dongle → AP)
# Internet:  wlp4s0 (upstream)

interface=wlxac15a2e2f47e
driver=nl80211

# Network identity
ssid=MyHotspot
channel=6

# Mode: 802.11n on 2.4GHz
hw_mode=g
ieee80211n=1
wmm_enabled=1

# Security: WPA2
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=ChangeMe123!

# Logging
logger_syslog=-1
logger_syslog_level=2
logger_stdout=-1
logger_stdout_level=2

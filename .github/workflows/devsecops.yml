name: DevSecOps Pipeline

on:
  push:
    branches: [ UI/UX, improvement, develop ]
  pull_request:
    branches: [ UI/UX, improvement, develop ]
  workflow_dispatch:

# audit-check uploads SARIF; without security-events:write it fails the job.
permissions:
  contents: read
  security-events: write

jobs:
  # 1. SAST & Static Analysis
  sast-and-lint:
    name: SAST & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Cargo Clippy (Rust SAST & Linting)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Cargo Audit (Vulnerability Scanner)
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  # 2. Container Security & Image Scan
  container-security:
    name: Container Security & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: sast-and-lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Docker Image
        run: docker build -t ap-manager:local .

      - name: Run Trivy Vulnerability Scanner (Image SAST)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ap-manager:local'
          format: 'table'
          exit-code: '1' # block PRs on fixable CRITICAL/HIGH; ignore-unfixed keeps it to patched CVEs
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # 3. DAST (Dynamic Application Security Testing)
  dast-scan:
    name: DAST & API Security Scan
    runs-on: ubuntu-latest
    needs: container-security
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build and start ap-manager service
        run: |
          cargo build --release
          ./target/release/ap-manager &
          echo $! > service.pid
          sleep 3

      - name: DAST - REST Endpoint Health & Security Check
        run: |
          echo "Testing REST endpoints for unexpected errors or security misconfigurations..."
          curl -sI http://127.0.0.1:42918/ | grep -E "200 OK|HTTP"
          curl -sI http://127.0.0.1:42918/api/status || true

      - name: DAST - OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          # action-baseline executes with --network=host on Linux runners, sharing the runner host network stack, so 127.0.0.1 reaches ap-manager directly.
          target: 'http://127.0.0.1:42918/'
          allow_issue_writing: false
          fail_action: false

      - name: Stop Service
        if: always()
        run: |
          if [ -f service.pid ]; then
            kill $(cat service.pid) || true
          fi
services:
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun-${COUNTRY}
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./country/${COUNTRY}/gluetun-state:/gluetun
    environment:
      - VPN_SERVICE_PROVIDER=nordvpn
      - VPN_TYPE=${VPN_TYPE}
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      - SERVER_CITIES=${SERVER_CITIES}
      - FIREWALL_OUTBOUND_SUBNETS=${FIREWALL_OUTBOUND_SUBNETS}
      - PROFILE_NAME=${COUNTRY}
      - DNS_SERVER=on
      - DNS_UPSTREAM_RESOLVER_TYPE=plain
      - DNS_UPSTREAM_PLAIN_ADDRESSES=1.1.1.1:53,8.8.8.8:53
    sysctls:
      - net.ipv4.ip_forward=1
    healthcheck:
      test: ["CMD", "sh", "-c", "ip link show tun0 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  wifi-ap:
    build:
      context: .
      dockerfile: access_point/Dockerfile.wifi-ap
    image: wifi-ap-image-${COUNTRY}
    container_name: wifi-ap-${COUNTRY}
    network_mode: host
    pid: host
    privileged: true
    environment:
      - AP_IFACE=${AP_IFACE}
      - AP_SSID=${AP_SSID}
      - AP_PASSWORD=${AP_PASSWORD}
      - AP_CHANNEL=${AP_CHANNEL}
      - AP_HW_MODE=${AP_HW_MODE:-g}
      - AP_CHANNEL_WIDTH=${AP_CHANNEL_WIDTH:-20}
      - AP_IP=${AP_IP}
      - AP_SUBNET=${AP_SUBNET}
      - AP_SECURITY=${AP_SECURITY:-wpa2}
      - AP_COUNTRY_CODE=${AP_COUNTRY_CODE:-US}
      - ROUTING_TABLE=${ROUTING_TABLE}
      - COUNTRY=${COUNTRY}
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  adguard:
    image: adguard/adguardhome
    container_name: adguard-${COUNTRY}
    network_mode: service:gluetun
    volumes:
      - ./country/${COUNTRY}/adguard-work:/opt/adguardhome/work
      - ./country/${COUNTRY}/adguard-conf:/opt/adguardhome/conf
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

services:
  ap-manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ap-manager
    network_mode: host
    privileged: true
    restart: unless-stopped
    environment:
      - HOST_PROJECT_DIR=${PWD}
      - API_PORT=42918
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/app
